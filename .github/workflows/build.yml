name: Build Click Buffer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (Geometry Dash 2.2074)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Geode mod with pinned GD 2.2074 bindings
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          # Pin bindings to the snapshot reported by official Geode 4.10.2 / GD 2.2074 installs.
          # The default is the moving bindings/main branch, which is newer and failed compiling in this run.
          bindings-ref: 262722335fa38846bd3df71ea6cad2d615534b6e

      - name: Upload the compiled .geode package
        uses: actions/upload-artifact@v4
        with:
          name: ClickBuffer-Windows-GD-2.2074
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
